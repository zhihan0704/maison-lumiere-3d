<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雨夜便利店 · Rainy Convenience Store</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏪</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #scene { position: fixed; inset: 0; display: block; }

  .hud { position: fixed; z-index: 10; color: #f5e9d0; user-select: none; }
  .title {
    top: 20px; left: 24px;
    padding: 12px 16px;
    background: rgba(20, 16, 12, 0.55);
    border-left: 3px solid #f2b544;
    border-radius: 4px;
    backdrop-filter: blur(6px);
  }
  .title h1 { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
  .title p { font-size: 12px; opacity: 0.7; margin-top: 4px; letter-spacing: 1px; }

  .hint {
    bottom: 20px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 1px;
    padding: 8px 16px; border-radius: 20px;
    background: rgba(20, 16, 12, 0.5);
    backdrop-filter: blur(6px);
    white-space: nowrap;
  }
  .hint span { color: #f2b544; }

  #rainToggle {
    position: fixed; top: 20px; right: 24px; z-index: 10;
    padding: 10px 18px; font-size: 13px; letter-spacing: 1px;
    color: #f5e9d0; background: rgba(20, 16, 12, 0.55);
    border: 1px solid rgba(242, 181, 68, 0.6); border-radius: 20px;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: background 0.2s;
  }
  #rainToggle:hover { background: rgba(242, 181, 68, 0.25); }

  .panel {
    position: fixed; top: 70px; right: 24px; z-index: 10;
    width: 200px; padding: 14px 16px;
    background: rgba(20, 16, 12, 0.6);
    border-radius: 10px; backdrop-filter: blur(6px);
    color: #f5e9d0; font-size: 12px;
  }
  .panel h3 { font-size: 13px; margin-bottom: 10px; letter-spacing: 1px; color: #f2b544; }
  .panel label { display: flex; justify-content: space-between; margin: 8px 0 4px; }
  .panel input[type=range] { width: 100%; accent-color: #f2b544; }
  #musicBtn {
    margin-top: 10px; width: 100%; padding: 8px;
    background: rgba(242, 181, 68, 0.2); color: #f5e9d0;
    border: 1px solid rgba(242, 181, 68, 0.5); border-radius: 6px;
    cursor: pointer; font-size: 12px; letter-spacing: 1px;
  }
  #musicBtn:hover { background: rgba(242, 181, 68, 0.35); }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud title">
  <h1>雨夜便利店</h1>
  <p>RAINY CONVENIENCE STORE · Three.js 起步场景</p>
</div>

<button id="rainToggle">🌧 雨中</button>

<div class="panel">
  <h3>氛围调节</h3>
  <label>雨势 <span id="rainVal">中</span></label>
  <input type="range" id="rainSlider" min="0" max="100" value="60">
  <label>暖光亮度 <span id="lightVal">中</span></label>
  <input type="range" id="lightSlider" min="20" max="100" value="70">
  <button id="musicBtn">🎵 播放背景音乐</button>
</div>

<div class="hud hint">
  <span>WASD</span> 移动 · <span>鼠标拖拽</span> 转视角 · <span>滚轮</span> 缩放
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// ============ 基础渲染器 ============
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1420);
scene.fog = new THREE.Fog(0x0d1420, 12, 26);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 50);
camera.position.set(0, 2.1, 6.8);

// ============ 卡通(Toon)渐变贴图 ============
const gradData = new Uint8Array([70, 130, 195, 255]);
const gradientMap = new THREE.DataTexture(gradData, 4, 1, THREE.LuminanceFormat);
gradientMap.minFilter = THREE.NearestFilter;
gradientMap.magFilter = THREE.NearestFilter;
gradientMap.needsUpdate = true;

function toon(color) {
  return new THREE.MeshToonMaterial({ color: color, gradientMap: gradientMap });
}

// ============ 灯光（三角色：暖店主光 / 冷窗光 / 环境补光）============
scene.add(new THREE.HemisphereLight(0xffe0b8, 0x7a5f42, 0.35));

// 店内暖黄主光（吊在天花板，投阴影）
const warmLight = new THREE.PointLight(0xffbf66, 2.4, 16, 1.5);
warmLight.position.set(0, 2.7, -1.0);
warmLight.castShadow = true;
warmLight.shadow.mapSize.set(1024, 1024);
warmLight.shadow.bias = -0.002;
scene.add(warmLight);

// 窗外冷色月光/路灯光（从左窗打入，压暗以免抢暖调）
const moonLight = new THREE.DirectionalLight(0x6f8fd0, 0.25);
moonLight.position.set(-6, 3, 1);
scene.add(moonLight);

// 柜台小射灯
const counterGlow = new THREE.PointLight(0xffe6b0, 1.0, 6);
counterGlow.position.set(0, 1.4, -1.6);
scene.add(counterGlow);

// 天花板
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(13, 11), toon(0xf5f0e5));
ceiling.rotation.x = Math.PI / 2;
ceiling.position.set(0, 3.2, -0.5);
scene.add(ceiling);

// 长方形吊顶灯板（暖光）
const lightPanel = new THREE.Mesh(
  new THREE.BoxGeometry(2.2, 0.05, 0.7),
  new THREE.MeshBasicMaterial({ color: 0xffe9b8 })
);
lightPanel.position.set(0, 3.15, -1.0);
scene.add(lightPanel);

// ============ 房间结构 ============
const room = new THREE.Group();
scene.add(room);

// 地板
const floor = new THREE.Mesh(new THREE.PlaneGeometry(13, 11), toon(0xe8e0d0));
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, -0.5);
floor.receiveShadow = true;
room.add(floor);

// 后墙
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(13, 3.2), toon(0xf2ede2));
backWall.position.set(0, 1.6, -5.5);
backWall.receiveShadow = true;
room.add(backWall);

// 右墙
const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(11, 3.2), toon(0xece3d2));
rightWall.rotation.y = -Math.PI / 2;
rightWall.position.set(6.5, 1.6, -0.5);
rightWall.receiveShadow = true;
room.add(rightWall);

// 左墙（分两段，中间留窗洞）
function leftWallSeg(z, w) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, 3.2), toon(0xece3d2));
  m.rotation.y = Math.PI / 2;
  m.position.set(-6.5, 1.6, z);
  m.receiveShadow = true;
  room.add(m);
}
leftWallSeg(-4.4, 2.2);   // 窗后段
leftWallSeg(2.6, 4.0);    // 窗前段
// 窗上下沿
const winTop = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 1.0), toon(0xece3d2));
winTop.rotation.y = Math.PI / 2; winTop.position.set(-6.5, 2.7, -1.2); room.add(winTop);
const winBot = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 0.9), toon(0xece3d2));
winBot.rotation.y = Math.PI / 2; winBot.position.set(-6.5, 0.45, -1.2); room.add(winBot);

// 窗玻璃（半透明深蓝，能看到外面雨）
const glass = new THREE.Mesh(
  new THREE.PlaneGeometry(4.6, 1.35),
  new THREE.MeshPhongMaterial({ color: 0x223355, transparent: true, opacity: 0.35, shininess: 80 })
);
glass.rotation.y = Math.PI / 2;
glass.position.set(-6.45, 1.6, -1.2);
room.add(glass);

// 窗外夜色背景板
const nightSky = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 20),
  new THREE.MeshBasicMaterial({ color: 0x0a1226 })
);
nightSky.rotation.y = Math.PI / 2;
nightSky.position.set(-15, 4, -1.2);
room.add(nightSky);

// ============ 柜台 ============
const counter = new THREE.Group();
room.add(counter);

const counterBody = new THREE.Mesh(new THREE.BoxGeometry(4.6, 1.0, 1.0), toon(0xf7f3ea));
counterBody.position.set(0, 0.5, -1.8);
counterBody.castShadow = true; counterBody.receiveShadow = true;
counter.add(counterBody);

const counterTop = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.08, 1.1), toon(0xd9c9a8));
counterTop.position.set(0, 1.04, -1.8);
counterTop.castShadow = true;
counter.add(counterTop);

// 收银机
const regBase = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.18, 0.4), toon(0x33363d));
regBase.position.set(0.9, 1.15, -1.9); counter.add(regBase);
const regScreen = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.3, 0.05), toon(0x9fd8c0));
regScreen.position.set(0.9, 1.4, -2.05); regScreen.rotation.x = -0.3; counter.add(regScreen);

// "新商品" 小立牌（Canvas 文字贴图）
function makeSignTexture(text, bg, fg) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 256, 128);
  ctx.fillStyle = fg; ctx.font = 'bold 56px "Microsoft YaHei"';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 66);
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
}
const sign = new THREE.Mesh(
  new THREE.PlaneGeometry(0.7, 0.35),
  new THREE.MeshBasicMaterial({ map: makeSignTexture('新商品', '#f2b544', '#3a2408') })
);
sign.position.set(-1.2, 1.35, -1.55); sign.rotation.x = -0.15;
counter.add(sign);

// ============ 店员小人（极简 toon）============
const clerk = new THREE.Group();
clerk.position.set(0, 0, -2.9);
room.add(clerk);

const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.5, 0.25), toon(0x7fb0d6));
body.position.y = 1.25; body.castShadow = true; clerk.add(body);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 16), toon(0xffe0c8));
head.position.y = 1.68; head.castShadow = true; clerk.add(head);
const hair = new THREE.Mesh(new THREE.SphereGeometry(0.215, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.55), toon(0x6b4433));
hair.position.y = 1.72; clerk.add(hair);
const legL = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.5, 0.16), toon(0x3a3f4a));
legL.position.set(-0.11, 0.6, 0); clerk.add(legL);
const legR = legL.clone(); legR.position.x = 0.11; clerk.add(legR);

// ============ 顾客排队系统 ============
function buildCustomer(coatColor) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.55, 0.26), toon(coatColor));
  body.position.y = 1.25; body.castShadow = true; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.19, 20, 16), toon(0xffe0c8));
  head.position.y = 1.68; head.castShadow = true; g.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.205, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.6), toon(0x2a2a2a));
  hair.position.y = 1.71; g.add(hair);
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.5, 0.15), toon(0x333333));
  legL.position.set(-0.1, 0.6, 0); g.add(legL);
  const legR = legL.clone(); legR.position.x = 0.1; g.add(legR);
  room.add(g);
  return { g, legL, legR, body };
}
const customers = [0x5a6b8a, 0x8a5a5a, 0x5a8a6a].map(c => buildCustomer(c));
// 队列位置（关东煮柜前），门口位置
const queueSlots = [
  new THREE.Vector3(3.3, 0, 0.4),
  new THREE.Vector3(3.3, 0, 1.3),
  new THREE.Vector3(3.3, 0, 2.2)
];
const doorPos = new THREE.Vector3(0, 0, 5.5);
// 顾客夹起来的那颗丸子
const pickedBall = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), toon(0xf5e6c8));
pickedBall.visible = false;
scene.add(pickedBall);

const player = new THREE.Group();
player.position.set(0, 0, 3.0);
room.add(player);

  if (!dragging) return;

  camPitch = Math.max(0.15, Math.min(1.2, camPitch));
  lastX = e.clientX; lastY = e.clientY;
});

function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,255,255,0.75)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
}

function addGlow(x, z, s, color) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false, color: color })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.1, z);
  m.scale.set(s, s * 1.8, 1);
  scene.add(m);
}

const utilityPole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 5, 8), toon(0x5a4a3a));
utilityPole.position.set(-4, 2.5, 7); scene.add(utilityPole);
const crossArm = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.08), toon(0x5a4a3a));
crossArm.position.set(-4, 4.5, 7); scene.add(crossArm);

// ============ 窗外雨（粒子）============
const RAIN_COUNT = 900;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(RAIN_COUNT * 3);
const rainSpeed = new Float32Array(RAIN_COUNT);
for (let i = 0; i < RAIN_COUNT; i++) {
  rainPos[i * 3]     = -8 - Math.random() * 6;     // x: 窗外
  rainPos[i * 3 + 1] = Math.random() * 6;           // y: 高度
  rainPos[i * 3 + 2] = -5 + Math.random() * 8;     // z: 沿窗分布
  rainSpeed[i] = 0.04 + Math.random() * 0.05;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.PointsMaterial({ color: 0x9db8e8, size: 0.04, transparent: true, opacity: 0.7 });
const rain = new THREE.Points(rainGeo, rainMat);
room.add(rain);

let rainOn = true;
document.getElementById('rainToggle').addEventListener('click', function () {
  rainOn = !rainOn;
  rain.visible = rainOn;
  this.textContent = rainOn ? '🌧 雨中' : '🌤 雨停';
});

// 雨势滑块：控制透明度和下落速度
const rainSlider = document.getElementById('rainSlider');
rainSlider.addEventListener('input', function () {
  const v = this.value / 100;
  rainMat.opacity = 0.7 * v;
  for (let i = 0; i < RAIN_COUNT; i++) rainSpeed[i] = (0.04 + (i % 5) * 0.01) * (0.3 + v);
  document.getElementById('rainVal').textContent = v < 0.3 ? '小' : v < 0.7 ? '中' : '大';
});

// 暖光亮度滑块
const lightSlider = document.getElementById('lightSlider');
lightSlider.addEventListener('input', function () {
  const v = this.value / 100;
  warmLight.intensity = 0.5 + v * 2.5;
  counterGlow.intensity = 0.2 + v * 1.0;
  document.getElementById('lightVal').textContent = v < 0.4 ? '暗' : v < 0.75 ? '中' : '亮';
});

// Web Audio lo-fi 背景音乐（代码合成，无音频文件）
let audioCtx = null, musicPlaying = false, musicTimer = null;
document.getElementById('musicBtn').addEventListener('click', function () {
  if (!musicPlaying) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const master = audioCtx.createGain();
    master.gain.value = 0.12;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 900;
    master.connect(filter); filter.connect(audioCtx.destination);
    // Am - F - G - Em 柔和和弦
    const chords = [
      [220.0, 261.6, 329.6],
      [174.6, 220.0, 261.6],
      [196.0, 246.9, 293.7],
      [164.8, 220.0, 261.6]
    ];
    let idx = 0;
    function playChord() {
      if (!musicPlaying) return;
      chords[idx % chords.length].forEach(freq => {
        const osc = audioCtx.createOscillator();
        osc.type = 'triangle'; osc.frequency.value = freq;
        const g = audioCtx.createGain();
        const t = audioCtx.currentTime;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.25, t + 1.2);
        g.gain.linearRampToValueAtTime(0, t + 3.8);
        osc.connect(g); g.connect(master);
        osc.start(t); osc.stop(t + 4);
      });
      idx++;
    }
    musicPlaying = true;
    playChord();
    musicTimer = setInterval(playChord, 3800);
    this.textContent = '⏸ 暂停音乐';
  } else {
    musicPlaying = false;
    clearInterval(musicTimer);
    if (audioCtx) audioCtx.close();
    this.textContent = '🎵 播放背景音乐';
  }
});

// ============ 第三人称跟随相机（在 animate 里更新）============
camera.position.set(0, 2.2, 6.8);

// ============ 动画循环 ============
const clock = new THREE.Clock();
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let doorOpen = 0, doorOpenTarget = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  if (rainOn && !reduceMotion) {
    const p = rainGeo.attributes.position.array;
    for (let i = 0; i < RAIN_COUNT; i++) {
      p[i * 3 + 1] -= rainSpeed[i];
      if (p[i * 3 + 1] < 0) p[i * 3 + 1] = 6;
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  // 关东煮热气上升
  if (!reduceMotion) {
    const sp = steamGeo.attributes.position.array;
    for (let i = 0; i < STEAM_COUNT; i++) {
      sp[i * 3 + 1] += steamSpeed[i];
      if (sp[i * 3 + 1] > 2.2) sp[i * 3 + 1] = 1.0;
    }
    steamGeo.attributes.position.needsUpdate = true;
  }

  // 店员轻微呼吸感
  if (!reduceMotion) {
    clerk.position.y = Math.sin(clock.elapsedTime * 1.5) * 0.01;
  }

  // ===== 顾客排队 + 夹关东煮 + 自动门 =====
  const et = clock.elapsedTime;
  const CYCLE = 16, STAGGER = 5;
  let nearDoor = false;
  customers.forEach((cust, i) => {
    const lt = (et + i * STAGGER) % CYCLE;
    let pos, walking = false, lean = 0;
    if (lt < 4) {
      const e = (lt / 4) * (lt / 4) * (3 - 2 * (lt / 4));
      pos = new THREE.Vector3().lerpVectors(doorPos, queueSlots[i], e);
      walking = true;
    } else if (lt < 11) {
      pos = queueSlots[i].clone();
      if (i === 0 && lt > 6 && lt < 9) lean = 0.25;   // 最前面弯腰夹丸子
    } else {
      const t = (lt - 11) / 5;
      const e = t * t * (3 - 2 * t);
      pos = new THREE.Vector3().lerpVectors(queueSlots[i], doorPos, e);
      walking = true;
    }
    cust.g.position.copy(pos);
    if (walking) {
      cust.g.position.y = Math.abs(Math.sin(et * 9)) * 0.05;
      cust.legL.rotation.x = Math.sin(et * 9) * 0.55;
      cust.legR.rotation.x = -Math.sin(et * 9) * 0.55;
    } else {
      cust.g.position.y = Math.sin(et * 1.5) * 0.01;
      cust.legL.rotation.x = 0; cust.legR.rotation.x = 0;
    }
    cust.body.rotation.x = lean;
    if (pos.z > 3.0) nearDoor = true;
    // 夹丸子时显示一颗
    pickedBall.visible = (i === 0 && lt > 6 && lt < 9);
    if (pickedBall.visible) pickedBall.position.set(3.3, 1.05, 0.5);
  });
  // 门平滑开合
  doorOpenTarget = nearDoor ? 1 : 0;
  doorOpen += (doorOpenTarget - doorOpen) * 0.06;
  doorL.position.x = -0.75 - doorOpen * 0.75;
  doorR.position.x = 0.75 + doorOpen * 0.75;

  // ===== 玩家移动（WASD / 方向键，相对相机方向）=====
  // 相机在玩家 (sin(camYaw), cos(camYaw)) 方向外，朝玩家看
  // 前进方向 = 相机朝向 = (-sin, -cos)，右方向 = (-cos, sin)
  let mvX = 0, mvZ = 0;
  const fX = -Math.sin(camYaw), fZ = -Math.cos(camYaw);
  const rX = -Math.cos(camYaw), rZ = Math.sin(camYaw);
  if (keys['KeyW'] || keys['ArrowUp']) { mvX += fX; mvZ += fZ; }
  if (keys['KeyS'] || keys['ArrowDown']) { mvX -= fX; mvZ -= fZ; }
  if (keys['KeyD'] || keys['ArrowRight']) { mvX += rX; mvZ += rZ; }
  if (keys['KeyA'] || keys['ArrowLeft']) { mvX -= rX; mvZ -= rZ; }
  const moving = (mvX !== 0 || mvZ !== 0);
  const speed = 2.6;
  if (moving && !reduceMotion) {
    const len = Math.hypot(mvX, mvZ);
    player.position.x += (mvX / len) * speed * dt;
    player.position.z += (mvZ / len) * speed * dt;
    const targetRot = Math.atan2(mvX, mvZ);
    player.rotation.y += (targetRot - player.rotation.y) * 0.15;
    player.position.y = Math.abs(Math.sin(et * 10)) * 0.05;
    player.position.y = Math.abs(Math.sin(et * 10)) * 0.05;
  } else {
    player.position.y = Math.sin(et * 1.5) * 0.01;
    player.position.y = Math.sin(et * 1.5) * 0.01;
  }
  // 限制在店内+门口
  player.position.x = Math.max(-6, Math.min(6, player.position.x));
  player.position.z = Math.max(-4.5, Math.min(9, player.position.z));

  // 第三人称相机：鼠标拖拽绕玩家转，滚轮缩放
  const cx = player.position.x + camDist * Math.sin(camYaw) * Math.cos(camPitch);
  const cy = player.position.y + 1.2 + camDist * Math.sin(camPitch);
  const cz = player.position.z + camDist * Math.cos(camYaw) * Math.cos(camPitch);
  camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.12);
  camera.lookAt(player.position.x, player.position.y + 1.3, player.position.z);

  renderer.render(scene, camera);
}
animate();

// 首帧立即渲染一次（reduced-motion 下也保证有画面）
renderer.render(scene, camera);

// ============ 自适应窗口 ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
